<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151d"><meta name="apple-mobile-web-app-capable" content="yes"><title>五子棋胜率助手</title><style>
:root{--bg:#0d1219;--p:#17202c;--t:#f3f7fb;--m:#9cabbc;--b:#4b8cff;--g:#35c98c;--y:#eeb857;--r:#ed6a6a;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overscroll-behavior:none}body{padding-top:var(--st);padding-bottom:var(--sb)}button,select{font:inherit}.app{min-height:100dvh;background:radial-gradient(circle at 50% 0,#1d2c40,#101720 40%,#0c1118);padding:10px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.top h1{font-size:18px;margin:0}.top small{display:block;color:var(--m);margin-top:3px}.status{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(135deg,#202b39,#17202b);border:1px solid #324156;border-radius:14px;margin-bottom:8px}.main{font-weight:800}.sub{font-size:11px;color:var(--m);margin-top:3px}.best{text-align:right;font-size:20px;font-weight:900;color:#68dda9}.best small{display:block;color:#cbd5e1;font-size:11px;margin-top:2px}.board{position:relative;aspect-ratio:1;max-width:620px;margin:auto;border-radius:16px;overflow:hidden;background:#d7a347;box-shadow:0 16px 40px #0006}canvas{width:100%;height:100%;display:block;touch-action:none}.tag{position:absolute;left:8px;top:8px;padding:6px 9px;border-radius:99px;background:#0b1119d9;border:1px solid #ffffff1c;font-size:10px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0}.buttons button{height:42px;border-radius:12px;border:1px solid #344357;background:#1a2532;color:#fff;font-size:12px}.buttons .primary{background:#3478e5}.panel{background:linear-gradient(#18222f,#101720);border:1px solid #2d3a4d;border-radius:18px;padding:10px;margin-top:8px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{background:#141d28;border:1px solid #2c394a;border-radius:12px;padding:9px}.field label{display:block;font-size:10px;color:var(--m);margin-bottom:5px}select{width:100%;background:transparent;color:#fff;border:0;outline:0}.list{display:flex;gap:8px;overflow:auto;margin-top:9px;scrollbar-width:none}.list::-webkit-scrollbar{display:none}.card{flex:0 0 104px;background:#141d28;border:1px solid #2d3b4e;border-radius:13px;padding:9px;color:#fff;text-align:left}.card.first{border-color:#5bd8a4}.coord{font-weight:850;font-size:16px}.pct{font-size:18px;font-weight:900;margin-top:6px}.why{font-size:10px;color:var(--m);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{font-size:11px;line-height:1.55;color:var(--m);margin-top:8px}.toast{position:fixed;left:50%;bottom:calc(18px + var(--sb));transform:translate(-50%,20px);opacity:0;background:#101822;border:1px solid #3b4b60;border-radius:12px;padding:10px 13px;font-size:12px;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(min-width:760px){.app{max-width:760px;margin:auto}}
</style></head><body><div class="app"><div class="top"><div><h1>五子棋胜率助手</h1><small>iPhone 版 · 录入双方落子</small></div></div><section class="status"><div><div id="turn" class="main">轮到你下</div><div id="sub" class="sub">点击一个胜率格</div></div><div id="best" class="best">H8<small>最佳胜率 67%</small></div></section><div class="board"><canvas id="cv"></canvas><div id="tag" class="tag">重点候选 · 自动分析</div></div><div class="buttons"><button id="new" class="primary">新棋局</button><button id="demo">演示</button><button id="undo">撤销</button><button id="ana">分析</button></div><section class="panel"><div class="settings"><div class="field"><label>我执棋色</label><select id="color"><option value="1">黑棋（先手）</option><option value="2">白棋（后手）</option></select></div><div class="field"><label>棋盘显示</label><select id="mode"><option value="top">重点候选</option><option value="all">全盘胜率</option><option value="best">只看最佳点</option></select></div></div><div id="list" class="list"></div><div class="note">现实棋盘每下一步，就在这里点同一个交叉点。轮到你时显示胜率，白圈为最佳点。当前胜率是浏览器启发式估算，用于体验操作效果。</div></section></div><div id="toast" class="toast"></div><script>
(()=>{const N=15,E=0,B=1,W=2,L='ABCDEFGHJKLMNOP',bd=Array.from({length:N},()=>Array(N).fill(E));let hs=[],cur=B,me=B,cs=[],over=false,mode='top';const $=x=>document.getElementById(x),cv=$('cv'),x=cv.getContext('2d');function op(p){return p===B?W:B}function co(r,c){return L[c]+(N-r)}function inside(r,c){return r>=0&&r<N&&c>=0&&c<N}function toast(s){let t=$('toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200)}function geo(){let q=cv.getBoundingClientRect(),p=Math.max(28,Math.min(q.width,q.height)*.052),z=Math.min(q.width,q.height)-2*p;return{w:q.width,h:q.height,p,s:z/(N-1)}}function resize(){let q=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=q.width*d;cv.height=q.height*d;x.setTransform(d,0,0,d,0,0);draw()}function pc(p,a=.78){return p>=70?`rgba(32,185,121,${a})`:p>=48?`rgba(232,166,66,${a})`:`rgba(220,76,76,${a})`}function draw(){let{w,h,p,s}=geo();x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#f2cd75');g.addColorStop(1,'#c78930');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='#2f1e07d6';x.lineWidth=Math.max(1,s*.025);for(let i=0;i<N;i++){let q=p+i*s;x.beginPath();x.moveTo(p,q);x.lineTo(p+14*s,q);x.stroke();x.beginPath();x.moveTo(q,p);x.lineTo(q,p+14*s);x.stroke()}x.fillStyle='#251608';[[3,3],[3,11],[7,7],[11,3],[11,11]].forEach(([r,c])=>{x.beginPath();x.arc(p+c*s,p+r*s,Math.max(2.8,s*.07),0,7);x.fill()});x.font=`650 ${Math.max(9,s*.25)}px -apple-system`;x.textAlign='center';x.textBaseline='middle';for(let i=0;i<N;i++){x.fillText(L[i],p+i*s,h-p*.38);x.fillText(N-i,p*.38,p+i*s)}if(cur===me&&!over){let a=mode==='best'?cs.slice(0,1):mode==='top'?cs.slice(0,18):cs;for(const z of a){let px=p+z.c*s,py=p+z.r*s;x.beginPath();x.arc(px,py,s*.39,0,7);x.fillStyle=pc(z.prob,mode==='all'?.54:.78);x.fill();if(z.rank===1){x.strokeStyle='#fff';x.lineWidth=Math.max(2,s*.065);x.stroke()}x.fillStyle='#fff';x.font=`850 ${Math.max(7.5,s*(mode==='all'?.175:.215))}px -apple-system`;x.fillText(z.prob+'%',px,py)}}for(let r=0;r<N;r++)for(let c=0;c<N;c++){let q=bd[r][c];if(!q)continue;let px=p+c*s,py=p+r*s,rad=s*.39,g=x.createRadialGradient(px-rad*.35,py-rad*.35,rad*.1,px,py,rad);if(q===B){g.addColorStop(0,'#4a4a4a');g.addColorStop(.35,'#151515');g.addColorStop(1,'#030303')}else{g.addColorStop(0,'#fff');g.addColorStop(.7,'#eceff2');g.addColorStop(1,'#b7bdc5')}x.fillStyle=g;x.beginPath();x.arc(px,py,rad,0,7);x.fill();x.fillStyle=q===B?'#fff':'#111820';x.font=`750 ${Math.max(8.5,s*.24)}px -apple-system`;x.fillText(1+hs.findIndex(m=>m.r===r&&m.c===c),px,py)}if(hs.length){let m=hs.at(-1),px=p+m.c*s,py=p+m.r*s,z=s*.115;x.strokeStyle='#ff5959';x.lineWidth=Math.max(1.4,s*.045);x.strokeRect(px-z,py-z,z*2,z*2)}}function win(r,c,p){for(const[d,e]of[[1,0],[0,1],[1,1],[1,-1]]){let n=1,k=1;while(inside(r+d*k,c+e*k)&&bd[r+d*k][c+e*k]===p)n++,k++;k=1;while(inside(r-d*k,c-e*k)&&bd[r-d*k][c-e*k]===p)n++,k++;if(n>=5)return true}return false}function inf(r,c,p,d,e){let a=0,b=0,k=1;while(inside(r-d*k,c-e*k)&&bd[r-d*k][c-e*k]===p)a++,k++;let oa=inside(r-d*k,c-e*k)&&bd[r-d*k][c-e*k]===E;k=1;while(inside(r+d*k,c+e*k)&&bd[r+d*k][c+e*k]===p)b++,k++;let ob=inside(r+d*k,c+e*k)&&bd[r+d*k][c+e*k]===E;return[1+a+b,(oa?1:0)+(ob?1:0)]}function ps(n,o){return n>=5?12e6:n===4&&o===2?1.5e6:n===4&&o===1?24e4:n===3&&o===2?6e4:n===3&&o===1?8e3:n===2&&o===2?1600:n===2&&o===1?280:n===1&&o===2?32:4}function score(r,c,p){if(bd[r][c])return-Infinity;bd[r][c]=p;let t=0,z=0;for(const[d,e]of[[1,0],[0,1],[1,1],[1,-1]]){let[n,o]=inf(r,c,p,d,e);t+=ps(n,o);if(n>=3&&o===2||n===4&&o)z++}if(z>=2)t*=2.2;let w=win(r,c,p);bd[r][c]=E;return w?5e7:t}function cells(){if(!hs.length)return[{r:7,c:7}];let m=new Map;for(const q of hs)for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++){let r=q.r+a,c=q.c+b;if(inside(r,c)&&!bd[r][c])m.set(r+','+c,{r,c})}return[...m.values()]}function why(o,d){return o>=4e7?'直接成五':d>=4e7?'必须封堵':o>=1e6?'形成活四':o>=1e5?'强制进攻':d>=1e5?'关键防守':o>=3e4?'双向威胁':'保持棋形'}function analyze(){if(over||cur!==me){cs=[];update();draw();return}$('tag').textContent='分析中…';setTimeout(()=>{let raw=[],oo=op(cur),must=false;for(const q of cells()){let a=score(q.r,q.c,cur),d=score(q.r,q.c,oo);if(d>=4e7)must=true;raw.push({...q,a,d,v:a+d*.92+10-Math.abs(q.r-7)-Math.abs(q.c-7)})}raw.sort((a,b)=>b.v-a.v);let lg=raw.map(q=>Math.log10(Math.max(1,q.v))),av=lg.reduce((a,b)=>a+b,0)/lg.length,sd=Math.sqrt(lg.reduce((a,b)=>a+(b-av)**2,0)/lg.length)||1;cs=raw.map((q,i)=>{let p=50+22*Math.tanh((Math.log10(Math.max(1,q.v))-av)/(sd*1.25));if(q.a>=4e7)p=99;else if(must&&q.d>=4e7)p=Math.max(p,88);else if(must&&q.d<4e7)p=Math.min(p,14);if(q.a>=1e6)p=Math.max(p,92);return{...q,rank:i+1,prob:Math.max(3,Math.min(99,Math.round(p))),why:why(q.a,q.d)}});$('tag').textContent=(mode==='all'?'全盘胜率':mode==='best'?'只看最佳点':'重点候选')+' · 已分析';update();draw()},80)}function update(){let mine=cur===me,b=cs[0];$('turn').textContent=over?(bd[hs.at(-1).r][hs.at(-1).c]===me?'你已获胜':'对方已获胜'):mine?'轮到你下':'等待对方落子';$('sub').textContent=over?'本局已经结束':mine?'点击一个胜率格':'把对方落点同步点进来';$('best').innerHTML=mine&&b?co(b.r,b.c)+`<small>最佳胜率 ${b.prob}%</small>`:'—<small>等待录入</small>';let l=$('list');l.innerHTML='';if(!mine||!b)l.innerHTML='<div class="note">现在轮到对方，请录入对方落点。</div>';else cs.slice(0,10).forEach(q=>{let e=document.createElement('button');e.className='card'+(q.rank===1?' first':'');e.innerHTML=`<div class="coord">${co(q.r,q.c)}</div><div class="pct" style="color:${q.prob>=70?'#68dda9':q.prob>=48?'#efc06a':'#ef8585'}">${q.prob}%</div><div class="why">${q.why}</div>`;e.onclick=()=>place(q.r,q.c);l.appendChild(e)});localStorage.setItem('gomoku_mobile',JSON.stringify({bd,hs,cur,me,over,mode}))}function place(r,c){if(over||bd[r][c])return;bd[r][c]=cur;hs.push({r,c,p:cur});if(win(r,c,cur)){over=true;cs=[];update();draw();toast((cur===me?'你':'对方')+'形成五连');return}cur=op(cur);cs=[];update();draw();analyze()}function tap(e){e.preventDefault();let q=cv.getBoundingClientRect(),g=geo(),t=e.changedTouches?e.changedTouches[0]:e,c=Math.round((t.clientX-q.left-g.p)/g.s),r=Math.round((t.clientY-q.top-g.p)/g.s);if(inside(r,c))place(r,c)}function reset(){bd.forEach(r=>r.fill(E));hs=[];cur=B;over=false;cs=[];update();draw();analyze()}function demo(){reset();[[7,7],[6,8],[7,8],[7,9],[8,7],[8,8],[6,7],[6,9],[7,6],[8,9]].forEach((m,i)=>{bd[m[0]][m[1]]=i%2?W:B;hs.push({r:m[0],c:m[1],p:i%2?W:B})});cur=B;me=B;$('color').value='1';analyze()}cv.addEventListener('touchend',tap,{passive:false});cv.addEventListener('click',e=>{if(!('ontouchstart'in window))tap(e)});$('new').onclick=reset;$('demo').onclick=demo;$('ana').onclick=analyze;$('undo').onclick=()=>{if(!hs.length)return toast('没有可撤销的落子');let m=hs.pop();bd[m.r][m.c]=E;cur=m.p;over=false;analyze()};$('color').onchange=e=>{me=+e.target.value;analyze()};$('mode').onchange=e=>{mode=e.target.value;analyze()};window.onresize=resize;resize();try{let s=JSON.parse(localStorage.getItem('gomoku_mobile'));if(s){for(let r=0;r<N;r++)for(let c=0;c<N;c++)bd[r][c]=s.bd[r][c];hs=s.hs;cur=s.cur;me=s.me;over=s.over;mode=s.mode;$('color').value=me;$('mode').value=mode;analyze()}else demo()}catch(e){demo()}})();
</script></body></html>
