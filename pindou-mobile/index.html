<title>拼豆图纸生成器</title>
<style>
:root{--a:#ff8063;--b:#f4f5f7;--l:#e2e5ea;--t:#20242a;--m:#737b87}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 12px 9px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--l)}h1{font-size:17px;margin:0 0 9px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tabs button,.btn{border:1px solid var(--l);background:#fff;border-radius:10px;min-height:42px;padding:8px 10px}.tabs button.on,.primary{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}.page{display:none;padding:10px 10px calc(env(safe-area-inset-bottom) + 18px)}.page.on{display:block}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(25,30,38,.05)}.title{font-size:14px;font-weight:700;margin-bottom:10px}.hint{font-size:11px;line-height:1.55;color:var(--m)}.upload{border:1px dashed #bfc5ce;border-radius:12px;padding:20px 10px;text-align:center;background:#fafbfc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.field{width:100%;height:42px;border:1px solid var(--l);border-radius:10px;background:#fff;padding:0 10px}.line{display:grid;grid-template-columns:76px 1fr 46px;gap:8px;align-items:center;margin:11px 0;font-size:12px}.line input{width:100%;accent-color:var(--a)}.v{text-align:right;color:var(--m);font-size:11px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--l);background:#fff;border-radius:999px;min-width:44px;height:34px}.pill.on{background:var(--a);border-color:var(--a);color:#fff}.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#eef0f3;border-radius:10px;padding:3px;gap:3px}.seg button{border:0;background:transparent;border-radius:8px;min-height:38px}.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.08)}.canvasBox{height:calc(100vh - 150px);min-height:480px;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;border:1px solid var(--l);border-radius:14px;overflow:auto;position:relative;display:grid;place-items:center;padding:10px}canvas{display:block;touch-action:none}.editor{width:100%;height:100%}.resultCanvas{background:#fff;box-shadow:0 5px 24px rgba(0,0,0,.14);image-rendering:pixelated}.bar{display:flex;gap:8px;position:sticky;bottom:0;padding:8px 0 calc(env(safe-area-inset-bottom) + 4px);background:linear-gradient(transparent,var(--b) 20%)}.bar .btn{flex:1}.check{display:flex;align-items:center;gap:7px;font-size:12px}.check input{accent-color:var(--a)}.status{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;background:rgba(20,24,30,.9);color:#fff;border-radius:9px;padding:9px 13px;font-size:12px;transition:.2s;z-index:50;pointer-events:none}.status.show{opacity:1;transform:translate(-50%,0)}.warn{background:#fff6f2;border:1px solid #ffd1c5;color:#73473c;border-radius:10px;padding:9px 10px;font-size:11px;line-height:1.5}.stats{font-size:12px;color:var(--m);margin-top:8px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.sw{aspect-ratio:1;border-radius:8px;border:1px solid rgba(0,0,0,.14);position:relative}.sw span{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:8px;text-shadow:0 1px #fff;color:#111}@media(min-width:900px){body{max-width:1180px;margin:auto}.top{border-left:1px solid var(--l);border-right:1px solid var(--l)}.page{padding:14px}.desktop{display:grid;grid-template-columns:340px 1fr;gap:12px}.canvasBox{height:760px}}
</style>
</head>
<body>
<header class="top"><h1>拼豆图纸生成器 · 手机精细版</h1><div class="tabs"><button class="on" data-p="set">设置</button><button data-p="src">原图</button><button data-p="out">图纸</button></div></header>
<section id="set" class="page on">
<div class="desktop"><div>
<div class="card"><div class="title">1. 导入原图</div><div class="upload"><div style="margin-bottom:10px">从相册或文件选择图片</div><button id="pick" class="btn primary">选择图片</button><input id="file" type="file" accept="image/*" hidden><div class="hint" style="margin-top:9px">图片仅在当前手机浏览器处理，不上传服务器。</div></div></div>
<div class="card"><div class="title">2. 图纸尺寸</div><div id="presets" class="pills"></div><div class="grid" style="margin-top:9px"><input id="gw" class="field" type="number" min="20" max="208" value="104"><input id="gh" class="field" type="number" min="20" max="208" value="104"></div><label class="check" style="margin-top:9px"><input id="square" type="checkbox" checked>宽高保持一致</label><div class="warn" style="margin-top:9px">双人图想保住眼镜、眼睛和头发细节，建议使用 128×128、156×156 或 208×208。</div></div>
<div class="card"><div class="title">3. 构图与精细化</div><div id="fit" class="seg"><button class="on" data-v="cover">铺满裁剪</button><button data-v="contain">完整保留</button></div><div class="line"><span>图片缩放</span><input id="zoom" type="range" min="50" max="350" value="100"><span id="zoomv" class="v">100%</span></div><div class="line"><span>颜色数量</span><input id="colors" type="range" min="8" max="64" value="40"><span id="colorsv" class="v">40</span></div><div class="line"><span>细节保留</span><input id="detail" type="range" min="0" max="100" value="84"><span id="detailv" class="v">84</span></div><div class="line"><span>轮廓强化</span><input id="edge" type="range" min="0" max="100" value="72"><span id="edgev" class="v">72</span></div><div class="line"><span>暗线优先</span><input id="dark" type="range" min="0" max="100" value="74"><span id="darkv" class="v">74</span></div><div class="line"><span>高倍采样</span><input id="sample" type="range" min="3" max="8" value="7"><span id="samplev" class="v">7x</span></div><div class="line"><span>对比度</span><input id="contrast" type="range" min="-30" max="40" value="8"><span id="contrastv" class="v">8</span></div><div class="line"><span>饱和度</span><input id="sat" type="range" min="-30" max="40" value="4"><span id="satv" class="v">4</span></div><label class="check"><input id="grid" type="checkbox" checked>显示网格</label></div>
<button id="generate" class="btn primary" style="width:100%;height:48px">生成精细拼豆图纸</button>
</div><div class="card" style="margin:0"><div class="title">快捷预览</div><div class="canvasBox" style="height:720px"><canvas id="mini" class="resultCanvas"></canvas><div id="emptyMini" class="hint">生成后在这里显示结果</div></div></div></div>
</section>
<section id="src" class="page"><div class="canvasBox"><canvas id="editor" class="editor"></canvas><div id="emptySrc" class="hint">先在“设置”里选择图片</div></div><div class="bar"><button id="reset" class="btn">重置构图</button><button id="toSet" class="btn primary">返回设置</button></div><div class="hint">单指拖动图片；双指缩放；也可以在设置页使用“图片缩放”。</div></section>
<section id="out" class="page"><div class="canvasBox"><canvas id="result" class="resultCanvas"></canvas><div id="emptyOut" class="hint">还没有生成图纸</div></div><div id="stats" class="stats"></div><div id="used" class="swatches"></div><div class="bar"><button id="minus" class="btn">缩小</button><button id="save" class="btn primary">保存 PNG</button><button id="plus" class="btn">放大</button></div></section>
<div id="toast" class="status"></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const S={img:null,w:104,h:104,fit:'cover',zoom:1,ox:0,oy:0,cells:null,pal:[],view:1,drag:false,start:null,pinch:null};
const ed=$('editor'),ec=ed.getContext('2d'),res=$('result'),rc=res.getContext('2d'),mini=$('mini'),mc=mini.getContext('2d');
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.p===p));if(p==='src')setTimeout(drawEditor,40);if(p==='out')setTimeout(drawResult,40)}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.p)};$('toSet').onclick=()=>show('set');
const ps=[64,78,96,104,128,156,208];ps.forEach(n=>{const b=document.createElement('button');b.className='pill'+(n===104?' on':'');b.textContent=n;b.onclick=()=>setSize(n,n);$('presets').appendChild(b)});
function setSize(w,h){S.w=clamp(+w||104,20,208);S.h=clamp(+h||104,20,208);$('gw').value=S.w;$('gh').value=S.h;document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',+b.textContent===S.w&&S.w===S.h));drawEditor()}
$('gw').onchange=e=>setSize(e.target.value,$('square').checked?e.target.value:$('gh').value);$('gh').onchange=e=>setSize($('square').checked?e.target.value:$('gw').value,e.target.value);
$('fit').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.fit=b.dataset.v;document.querySelectorAll('#fit button').forEach(x=>x.classList.toggle('on',x===b));S.ox=S.oy=0;drawEditor()};
[['zoom','zoomv','%'],['colors','colorsv',''],['detail','detailv',''],['edge','edgev',''],['dark','darkv',''],['sample','samplev','x'],['contrast','contrastv',''],['sat','satv','']].forEach(([a,b,u])=>$(a).oninput=()=>{$(b).textContent=$(a).value+u;if(a==='zoom'){S.zoom=+$('zoom').value/100;drawEditor()}});
$('pick').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{const i=new Image;i.onload=()=>{S.img=i;S.zoom=1;S.ox=S.oy=0;$('zoom').value=100;$('zoomv').textContent='100%';$('emptySrc').style.display='none';drawEditor();show('src');toast('图片已载入')};i.src=r.result};r.readAsDataURL(f)};
function resizeEditor(){const box=ed.parentElement.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);ed.width=Math.max(320,box.width*d);ed.height=Math.max(480,box.height*d);ed.style.width=box.width+'px';ed.style.height=box.height+'px';ec.setTransform(d,0,0,d,0,0)}
function cropRect(){const W=ed.clientWidth,H=ed.clientHeight,p=18,ar=S.w/S.h;let w=W-p*2,h=w/ar;if(h>H-p*2){h=H-p*2;w=h*ar}return{x:(W-w)/2,y:(H-h)/2,w,h}}
function drawEditor(){resizeEditor();const W=ed.clientWidth,H=ed.clientHeight;ec.clearRect(0,0,W,H);ec.fillStyle='#f2f3f5';ec.fillRect(0,0,W,H);const r=cropRect();ec.fillStyle='#fff';ec.fillRect(r.x,r.y,r.w,r.h);if(S.img){const base=S.fit==='cover'?Math.max(r.w/S.img.width,r.h/S.img.height):Math.min(r.w/S.img.width,r.h/S.img.height),sc=base*S.zoom;ec.save();ec.beginPath();ec.rect(r.x,r.y,r.w,r.h);ec.clip();ec.translate(r.x+r.w/2+S.ox,r.y+r.h/2+S.oy);ec.scale(sc,sc);ec.imageSmoothingEnabled=true;ec.imageSmoothingQuality='high';ec.drawImage(S.img,-S.img.width/2,-S.img.height/2);ec.restore()}ec.strokeStyle='#ff8063';ec.lineWidth=2;ec.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);ec.fillStyle='#333';ec.font='12px sans-serif';ec.fillText(S.w+' × '+S.h,r.x+8,r.y+18)}
function point(e){const r=ed.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
ed.addEventListener('pointerdown',e=>{if(!S.img)return;S.drag=true;ed.setPointerCapture(e.pointerId);S.start={x:e.clientX,y:e.clientY,ox:S.ox,oy:S.oy}});ed.addEventListener('pointermove',e=>{if(!S.drag)return;S.ox=S.start.ox+e.clientX-S.start.x;S.oy=S.start.oy+e.clientY-S.start.y;drawEditor()});ed.addEventListener('pointerup',()=>S.drag=false);ed.addEventListener('pointercancel',()=>S.drag=false);
const td=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);ed.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();S.pinch={d:td(e.touches[0],e.touches[1]),z:S.zoom}}},{passive:false});ed.addEventListener('touchmove',e=>{if(e.touches.length===2&&S.pinch){e.preventDefault();S.zoom=clamp(S.pinch.z*td(e.touches[0],e.touches[1])/S.pinch.d,.5,3.5);$('zoom').value=Math.round(S.zoom*100);$('zoomv').textContent=Math.round(S.zoom*100)+'%';drawEditor()}},{passive:false});ed.addEventListener('touchend',()=>S.pinch=null);
$('reset').onclick=()=>{S.zoom=1;S.ox=S.oy=0;$('zoom').value=100;$('zoomv').textContent='100%';drawEditor()};
function hsl(h,s,l){s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(h/60%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return[r+m,g+m,b+m].map(v=>Math.round(v*255))}
function palette(){const p=[[255,255,255],[245,240,230],[217,217,217],[153,153,153],[85,88,93],[23,23,23],[255,209,181],[240,172,138],[201,124,93],[139,75,62],[255,208,221],[246,154,177],[231,71,120],[139,37,66],[255,138,128],[233,61,61],[168,40,40],[255,192,138],[242,138,43],[201,93,32],[255,240,166],[255,217,61],[183,139,38],[215,237,181],[100,184,90],[45,143,80],[31,90,58],[167,227,210],[73,191,166],[31,125,121],[185,238,242],[134,201,244],[58,167,216],[49,108,203],[36,68,143],[32,47,91],[220,201,243],[169,144,214],[117,84,180],[78,50,125],[215,174,131],[184,122,71],[128,80,57],[75,48,40],[47,35,31],[255,176,168],[241,120,104],[185,167,106],[211,195,157],[112,137,164],[63,88,107]];for(let l of[32,50,68])for(let s of[42,72])for(let h=0;h<360;h+=30)p.push(hsl(h,s,l));return p.map((c,i)=>({r:c[0],g:c[1],b:c[2],code:'P'+String(i+1).padStart(3,'0')}))}
function adjust(d){const cv=+$('contrast').value,cf=(259*(cv+255))/(255*(259-cv)),sat=1+(+$('sat').value)/100;for(let i=0;i<d.length;i+=4){let r=cf*(d[i]-128)+128,g=cf*(d[i+1]-128)+128,b=cf*(d[i+2]-128)+128,l=.2126*r+.7152*g+.0722*b;d[i]=clamp(l+(r-l)*sat,0,255);d[i+1]=clamp(l+(g-l)*sat,0,255);d[i+2]=clamp(l+(b-l)*sat,0,255)}}
function source(){const f=+$('sample').value,W=S.w*f,H=S.h*f,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,W,H);const base=S.fit==='cover'?Math.max(W/S.img.width,H/S.img.height):Math.min(W/S.img.width,H/S.img.height),sc=base*S.zoom,r=cropRect();x.save();x.translate(W/2+S.ox/r.w*W,H/2+S.oy/r.h*H);x.scale(sc,sc);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(S.img,-S.img.width/2,-S.img.height/2);x.restore();const id=x.getImageData(0,0,W,H);adjust(id.data);return{id,f}}
function down(o){const {id,f}=o,src=id.data,W=S.w*f,H=S.h*f,out=new Uint8ClampedArray(S.w*S.h*4),det=+$('detail').value/100,edge=+$('edge').value/100,dark=+$('dark').value/100,lum=(x,y)=>{x=clamp(x,0,W-1);y=clamp(y,0,H-1);const p=(y*W+x)*4;return .2126*src[p]+.7152*src[p+1]+.0722*src[p+2]};for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){let ar=0,ag=0,ab=0,al=0,n=f*f;for(let yy=0;yy<f;yy++)for(let xx=0;xx<f;xx++){const p=((y*f+yy)*W+x*f+xx)*4,r=src[p],g=src[p+1],b=src[p+2];ar+=r;ag+=g;ab+=b;al+=.2126*r+.7152*g+.0722*b}const ml=al/n;let wr=0,wg=0,wb=0,ws=0,dr=0,dg=0,db=0,dn=0;for(let yy=0;yy<f;yy++)for(let xx=0;xx<f;xx++){const X=x*f+xx,Y=y*f+yy,p=(Y*W+X)*4,r=src[p],g=src[p+1],b=src[p+2],l=.2126*r+.7152*g+.0722*b,e=Math.abs(lum(X+1,Y)-lum(X-1,Y))+Math.abs(lum(X,Y+1)-lum(X,Y-1)),q=1+det*Math.min(2.8,Math.abs(l-ml)/34)+edge*Math.min(2.2,e/35)+dark*Math.max(0,(ml-l)/45);wr+=r*q;wg+=g*q;wb+=b*q;ws+=q;if(l<ml-15){dr+=r;dg+=g;db+=b;dn++}}let r=wr/ws,g=wg/ws,b=wb/ws;if(dn/n>.035&&dn/n<.42){const q=edge*(.25+.5*dark);r=r*(1-q)+dr/dn*q;g=g*(1-q)+dg/dn*q;b=b*(1-q)+db/dn*q}const p=(y*S.w+x)*4;out[p]=r;out[p+1]=g;out[p+2]=b;out[p+3]=255}return out}
function near(r,g,b,p){let k=0,d=1e9;for(let i=0;i<p.length;i++){const c=p[i],v=(r-c.r)**2*1.15+(g-c.g)**2*1.4+(b-c.b)**2*.9;if(v<d){d=v;k=i}}return k}
function generate(){if(!S.img)return toast('请先选择图片');toast('正在生成…');setTimeout(()=>{const pix=down(source()),full=palette(),cnt=new Uint32Array(full.length);for(let i=0;i<pix.length;i+=4)cnt[near(pix[i],pix[i+1],pix[i+2],full)]++;const max=+$('colors').value,ids=[...cnt.keys()].sort((a,b)=>cnt[b]-cnt[a]).slice(0,max),pal=ids.map(i=>full[i]);S.cells=new Array(S.w*S.h);for(let i=0,j=0;i<pix.length;i+=4,j++)S.cells[j]=pal[near(pix[i],pix[i+1],pix[i+2],pal)];S.pal=pal;$('emptyOut').style.display='none';$('emptyMini').style.display='none';drawResult();show('out');toast('生成完成')},30)}$('generate').onclick=generate;
function cellSize(box,mobile=true){return Math.max(2,Math.floor(Math.min((box.clientWidth-24)/S.w,(box.clientHeight-24)/S.h)*(mobile?S.view:1)))}
function drawTo(c,ctx,cell,grid){c.width=S.w*cell;c.height=S.h*cell;c.style.width=c.width+'px';c.style.height=c.height+'px';ctx.clearRect(0,0,c.width,c.height);for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const q=S.cells[y*S.w+x];ctx.fillStyle=`rgb(${q.r},${q.g},${q.b})`;ctx.fillRect(x*cell,y*cell,cell,cell)}if(grid&&cell>=4){ctx.strokeStyle='rgba(30,30,30,.22)';ctx.lineWidth=.5;ctx.beginPath();for(let x=0;x<=S.w;x++){ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,c.height)}for(let y=0;y<=S.h;y++){ctx.moveTo(0,y*cell);ctx.lineTo(c.width,y*cell)}ctx.stroke();ctx.strokeStyle='rgba(255,55,55,.72)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=S.w;x+=10){ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,c.height)}for(let y=0;y<=S.h;y+=10){ctx.moveTo(0,y*cell);ctx.lineTo(c.width,y*cell)}ctx.stroke()}}
function drawResult(){if(!S.cells)return;drawTo(res,rc,cellSize(res.parentElement),$('grid').checked);drawTo(mini,mc,Math.max(2,Math.floor(Math.min(690/S.w,690/S.h))),$('grid').checked);const map=new Map;S.cells.forEach(c=>map.set(c.code,(map.get(c.code)||0)+1));$('stats').textContent=`${S.w}×${S.h} · ${map.size}色 · ${S.w*S.h}颗`;$('used').innerHTML='';[...map].sort((a,b)=>b[1]-a[1]).slice(0,25).forEach(([code,n])=>{const c=S.pal.find(x=>x.code===code),d=document.createElement('div');d.className='sw';d.style.background=`rgb(${c.r},${c.g},${c.b})`;d.innerHTML=`<span>${code}<br>${n}</span>`;$('used').appendChild(d)})}
$('plus').onclick=()=>{S.view=clamp(S.view+.25,.5,4);drawResult()};$('minus').onclick=()=>{S.view=clamp(S.view-.25,.5,4);drawResult()};$('save').onclick=()=>{if(!S.cells)return toast('请先生成图纸');const c=document.createElement('canvas'),x=c.getContext('2d'),cell=12;drawTo(c,x,cell,true);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`拼豆图纸_${S.w}x${S.h}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};
window.addEventListener('resize',()=>{if(document.querySelector('#src.on'))drawEditor();if(S.cells)drawResult()});setSize(104,104)})();
</script>
